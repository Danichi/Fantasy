name: Fantasy CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: fantasy-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      # The suite is split across four machines that run at once (each boots the
      # game once per worker and reuses it; see tests/fixtures.ts).
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 60 # the suite covers the whole world now (40+ browser tests)
    env:
      PLAYWRIGHT_WORKERS: 2
      # Software-rendered browsers sharing the runner's cores: stretch boot waits and timeouts.
      PW_SLOW: 1.5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck + Vite build
        run: npm run build

      - name: Playwright smoke tests
        run: npx playwright test --shard=${{ matrix.shard }}/4
