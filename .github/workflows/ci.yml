name: Fantasy CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: fantasy-ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        workers: [2, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 60 # the suite covers the whole world now (40+ browser tests)
    env:
      PLAYWRIGHT_WORKERS: ${{ matrix.workers }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck + Vite build
        run: npm run build

      - name: Playwright smoke tests
        run: npm test
